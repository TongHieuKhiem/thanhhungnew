<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Nền đỏ bo góc tròn sang trọng -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#favBg)" stroke="#fecdd3" stroke-width="1.5"/>

  <!-- Tia tốc độ vận chuyển nhanh (Speed lines) -->
  <path d="M8 24 h10 M6 31 h8 M10 38 h8" stroke="url(#favGold)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Thùng xe tải màu trắng nổi bật -->
  <path d="M22 20 h22 v19 h-22 z" fill="#ffffff" rx="2"/>

  <!-- Chữ VN vàng đỏ mini tinh xảo trên thùng xe -->
  <rect x="25" y="23" width="16" height="5" rx="1.5" fill="#c5161d"/>
  <circle cx="33" cy="25.5" r="1.5" fill="url(#favGold)"/>

  <!-- Đầu cabin xe tải -->
  <path d="M44 26 h7 c2 0 3.5 1.5 4.5 3.5 l3 5 c.5 1 .5 2 .5 3.5 v3 h-15 z" fill="#ffffff"/>

  <!-- Cửa sổ kính cabin màu xanh biển nhạt -->
  <path d="M46 28 h4.5 l3 4.5 h-7.5 z" fill="#38bdf8"/>

  <!-- Bánh xe 1 (Bánh trước) -->
  <circle cx="49" cy="42" r="5.5" fill="#0f172a"/>
  <circle cx="49" cy="42" r="2.8" fill="url(#favGold)"/>

  <!-- Bánh xe 2 (Bánh sau) -->
  <circle cx="28" cy="42" r="5.5" fill="#0f172a"/>
  <circle cx="28" cy="42" r="2.8" fill="url(#favGold)"/>

  <!-- Đèn pha vàng xe tải -->
  <rect x="57" y="36" width="2" height="3" rx="1" fill="url(#favGold)"/>
</svg>
